services:
  web:
    image: nginx:alpine
    ports: ["3000:80"]
    # repo dir may be mode 700 (root-only); run workers as root so they can read it
    command: ["sh", "-ec", "sed -i 's/^user .*/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<html' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      base44.project: "Chris's Notes"
      base44.kind: web
      base44.port: "3000"
